<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verksamhetsmarknaden – Demo</title>
<style>
:root{--ink:#15263a;--muted:#65758a;--navy:#10243b;--accent:#0b806d;--red:#dc3d48;--bg:#f5f7fa;--line:#e1e7ee;--gold:#c69b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav{max-width:1160px;margin:auto;display:flex;align-items:center;gap:12px;padding:13px 18px;flex-wrap:wrap}.logo{font-weight:850;font-size:19px;letter-spacing:-.6px;margin-right:auto}.logo span{color:var(--accent)}.nav button{border:0;background:transparent;padding:9px 12px;border-radius:9px;color:var(--ink);font-weight:650}.nav button:hover,.nav button.active{background:#eaf3f1}.nav button.live{color:var(--red)}main{max-width:1160px;margin:auto;padding:24px 18px 70px}.hero{border-radius:20px;background:linear-gradient(115deg,#10243b,#1c5360);color:#fff;padding:48px 34px;margin-bottom:22px}.hero h1{font-size:clamp(27px,4vw,45px);line-height:1.1;max-width:680px;margin:0 0 12px}.hero p{max-width:620px;color:#d8e5ea}.btn{border:0;background:var(--accent);color:white;padding:11px 17px;border-radius:10px;font-weight:750}.btn.secondary{background:#e8eff3;color:var(--ink)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.hero .btn.secondary{background:#fff}.section{margin:26px 0}.section h2{margin:0 0 13px;font-size:25px}.sub{color:var(--muted);margin:-5px 0 16px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}.card .inside{padding:17px}.card h3{margin:0 0 5px;font-size:18px}.card p{color:var(--muted);margin:5px 0 12px}.card img{width:100%;height:175px;object-fit:cover;background:#dce5e8}.tag{display:inline-flex;border-radius:30px;padding:4px 9px;font-size:12px;font-weight:800;background:#edf2f5;color:#4e6374}.tag.live{background:#ffe9ec;color:#bc2434}.tag.gold{background:#fff1d4;color:#916311}.tag.ok{background:#dff4ec;color:#176b50}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.price{font-size:23px;font-weight:850}.muted{color:var(--muted)}.small{font-size:12px}.panel{padding:22px;background:#fff;border:1px solid var(--line);border-radius:15px;margin:16px 0}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.field{display:flex;flex-direction:column;gap:5px;margin:11px 0}.field label{font-weight:700;font-size:13px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cbd6df;border-radius:9px;background:#fff;color:var(--ink)}.field textarea{min-height:95px;resize:vertical}.notice{border-radius:11px;padding:12px 15px;background:#fff7dd;color:#765400;margin:12px 0}.notice.info{background:#eaf5f7;color:#1b5968}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f1f5f7;border-radius:10px;padding:13px}.stat b{display:block;font-size:20px}.ad{border:1px dashed #9eb0bc;border-radius:14px;padding:20px;background:#f0f5f8}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);border-radius:20px;background:white;padding:8px 14px}.tabs button.sel{background:var(--navy);color:white}.avatar{width:66px;height:66px;border-radius:50%;object-fit:cover;background:#d8e8e4;display:grid;place-items:center;font-size:24px;font-weight:800}.bidlist{max-height:260px;overflow:auto}.bid{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}.progress{height:7px;background:#e4eaee;border-radius:10px;overflow:hidden}.progress div{height:100%;background:var(--accent)}footer{text-align:center;color:var(--muted);padding:28px;border-top:1px solid var(--line)}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.hero{padding:30px 22px}}@media(max-width:540px){.grid{grid-template-columns:1fr}.nav{gap:3px}.nav button{font-size:12px;padding:8px}.logo{width:100%}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><nav class="nav" id="nav"><div class="logo">Verksamhets<span>marknaden</span></div><button data-page="home" class="active">Hem</button><button data-page="explore">Utforska</button><button data-page="live" class="live">🔴 LIVE</button><button data-page="sell">Sälj företag</button><button data-page="academy">Säljarakademin</button><button data-page="account">Mitt konto</button></nav></header>
<main id="app"></main><footer>Verksamhetsmarknaden · Interaktiv demoversion · Inga riktiga konton, bud eller betalningar</footer>
<script>
'use strict';
const STORE='vm_demo_html_v4';const day=86400000;const now=Date.now();
const samples=[
{id:'a1',title:'Välbesökt café i Stockholm',category:'Café',city:'Stockholm',price:790000,description:'Mysigt café med återkommande kunder och attraktivt läge.',image:'https://images.unsplash.com/photo-1554118811-1e0d58224f24?w=1000&q=80',plan:'ultimate',auction:true,start:now-2*3600000,end:now+5*3600000,step:10000,bids:[{name:'Demo-budgivare 1',amount:810000,at:now-700000},{name:'Demo-budgivare 2',amount:830000,at:now-350000}],approved:true},
{id:'a2',title:'Bilverkstad med etablerad kundkrets',category:'Bilverkstad',city:'Norrköping',price:1250000,description:'Välutrustad verkstad med trogna kunder.',image:'https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=1000&q=80',plan:'gold',auction:true,start:now-3600000,end:now+2*day,step:20000,bids:[{name:'Demo-budgivare 3',amount:1270000,at:now-900000}],approved:false},
{id:'a3',title:'Gatukök med centralt läge',category:'Restaurang',city:'Linköping',price:350000,description:'Nyckelfärdigt gatukök med utrustning.',image:'https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=1000&q=80',plan:'ultimate',auction:true,start:now+day,end:now+3*day,step:5000,bids:[],approved:false},
{id:'a4',title:'Lokal e-handel inom heminredning',category:'E-handel',city:'Göteborg',price:480000,description:'Webbutik med etablerade leverantörskontakter.',image:'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1000&q=80',plan:'free',auction:false,bids:[]}
];
function load(){try{const d=JSON.parse(localStorage.getItem(STORE));if(d&&Array.isArray(d.listings))return d}catch(e){}return {listings:samples,profile:{name:'Demoanvändare',image:''},applications:{a1:'approved'},favorites:[],lessons:[],npc:true}}
let state=load(),page='home',selected='a1',filter='all',editId=null;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){alert('Det gick inte att spara lokalt. Bilden kan vara för stor eller lagringsutrymmet fullt.')}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK',maximumFractionDigits:0}).format(n||0)}
function datefmt(t){return new Date(t).toLocaleString('sv-SE',{dateStyle:'medium',timeStyle:'short'})}
function remain(t){let n=Math.max(0,Math.floor((t-Date.now())/1000));let d=Math.floor(n/86400),h=Math.floor(n%86400/3600),m=Math.floor(n%3600/60),s=n%60;return d?`${d} d ${h} tim ${m} min`:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function phase(x){if(!x.auction)return 'vanlig';if(Date.now()<x.start)return 'kommande';if(Date.now()>=x.end)return 'avslutad';return 'live'}
function top(x){return Math.max(x.price,...(x.bids||[]).map(b=>b.amount))}
function get(id){return state.listings.find(x=>x.id===id)}
function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}
function photo(x){return x.image||'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1000&q=80'}
function badge(x){let p=phase(x);return p==='live'?'<span class="tag live">● LIVE · DEMO</span>':p==='kommande'?'<span class="tag">Kommande auktion</span>':p==='avslutad'?'<span class="tag">Avslutad auktion</span>':`<span class="tag ${x.plan==='ultimate'?'gold':''}">${x.plan==='ultimate'?'Ultimate':x.plan==='gold'?'Gold':'Till salu'}</span>`}
function listingCard(x){return `<article class="card"><img src="${esc(photo(x))}" alt="Illustrationsbild" onerror="this.style.display='none'"><div class="inside"><div class="row between">${badge(x)}<button class="btn outline" style="padding:5px 10px" data-fav="${esc(x.id)}">${state.favorites.includes(x.id)?'♥':'♡'}</button></div><h3>${esc(x.title)}</h3><p>${esc(x.city)} · ${esc(x.category)}</p><div class="price">${money(x.auction?top(x):x.price)}</div><p class="small">${x.auction?'Aktuellt demobud / utgångspris':'Begärt pris'}</p>${x.auction?`<p class="small">${phase(x)==='live'?'Tid kvar: '+remain(x.end):phase(x)==='kommande'?'Start: '+datefmt(x.start):'Auktionen avslutad'}</p>`:''}<button class="btn" data-open="${esc(x.id)}">${x.auction?'Visa auktion':'Visa annons'}</button></div></article>`}
function home(){let live=state.listings.filter(x=>phase(x)==='live');return `<section class="hero"><span class="tag ok">Företagsförsäljning på dina villkor</span><h1>Sälj ditt företag själv. Upptäck nästa möjlighet.</h1><p>Utforska företag, prova liveauktioner och lär dig sälja steg för steg – utan krav på traditionell mäklare.</p><div class="row"><button class="btn" data-page="explore">Utforska företag</button><button class="btn secondary" data-page="sell">Skapa annons</button></div></section><div class="notice">🧪 Detta är en demo. Auktionerna och NPC-buden är simulerade, och inga riktiga köp eller betalningar genomförs.</div><section class="section"><div class="row between"><h2>🔴 Pågående liveauktioner</h2><button class="btn secondary" data-page="live">Se alla LIVE</button></div><div class="grid">${live.length?live.slice(0,3).map(listingCard).join(''):'<p>Inga auktioner pågår just nu.</p>'}</div></section><section class="section"><h2>Upptäck företag</h2><div class="grid">${state.listings.slice(0,3).map(listingCard).join('')}</div></section><section class="section"><div class="ad"><span class="tag">ANNONSPLATS · DEMO</span><h2>Finansiering för ditt nästa företag?</h2><p>Här kan banker, finansbolag eller samarbetspartner annonsera. Inga verkliga sponsorer är anslutna.</p><button class="btn secondary" data-page="plans">Se annonspaket</button></div></section><section class="section"><h2>Enklare att sälja utan mäklare</h2><div class="grid"><div class="panel"><h3>1. Skapa annons</h3><p>Beskriv företaget och lägg till bilder och pris.</p></div><div class="panel"><h3>2. Välj försäljningssätt</h3><p>Vanlig annons eller schemalagd liveauktion.</p></div><div class="panel"><h3>3. Lär dig affären</h3><p>Gratis säljarakademi och checklistor.</p></div></div></section>`}
function explore(){let q=document.getElementById('search')?.value||'';return `<h1>Utforska företag</h1><p class="sub">Alla annonser i denna version är lokala demoannonser.</p><div class="panel"><div class="field"><label>Sök på namn, kategori eller ort</label><input id="search" placeholder="Exempel: café, Stockholm..."></div><div class="row"><button class="btn secondary" id="searchBtn">Sök</button><button class="btn outline" data-page="plans">Annonspaket</button></div></div><div class="grid" id="results">${state.listings.map(listingCard).join('')}</div>`}
function live(){let list=state.listings.filter(x=>x.auction&& (filter==='all'||phase(x)===filter));return `<h1>🔴 LIVE-auktioner</h1><p class="sub">Följ bud i realtid i denna webbläsare. NPC-bud är enbart simulerade.</p><div class="notice info">Ansök om deltagande före eller under auktionen. I denna demo godkänns ansökningar automatiskt efter bekräftelse – ingen riktig identitets- eller finansieringskontroll görs.</div><div class="tabs">${[['all','Alla'],['live','Pågående'],['kommande','Kommande'],['avslutad','Avslutade']].map(([v,t])=>`<button data-filter="${v}" class="${filter===v?'sel':''}">${t}</button>`).join('')}</div><div class="grid">${list.length?list.map(listingCard).join(''):'<p>Inga auktioner i den här kategorin.</p>'}</div>`}
function detail(x){let p=phase(x),app=state.applications[x.id],minimum=top(x)+(x.step||1000);return `<div class="row"><button class="btn secondary" data-page="${x.auction?'live':'explore'}">← Tillbaka</button>${badge(x)}</div><div class="two section"><div><div class="card"><img style="height:320px" src="${esc(photo(x))}" alt="Illustrationsbild" onerror="this.style.display='none'"><div class="inside"><h1>${esc(x.title)}</h1><p>${esc(x.city)} · ${esc(x.category)}</p><p>${esc(x.description)}</p><p class="muted small">Säljaren och företagsuppgifterna är inte verifierade i denna demo.</p></div></div><div class="panel"><h2>Information</h2><p>Utgångspris: <b>${money(x.price)}</b></p><p>Paket: <b>${esc(x.plan)}</b></p>${x.auction?`<p>Start: ${datefmt(x.start)}</p><p>Slut: ${datefmt(x.end)}</p><p>Minsta höjning: ${money(x.step)}</p>`:''}</div></div><div>${x.auction?`<div class="panel"><span class="tag live">SIMULERAD BUDGIVNING</span><p class="muted">Högsta demobud</p><div class="price">${money(top(x))}</div><div class="stats"><div class="stat"><span class="small">Antal bud</span><b>${x.bids.length}</b></div><div class="stat"><span class="small">Status</span><b>${p==='live'?'LIVE':p==='kommande'?'Snart':'Slut'}</b></div><div class="stat"><span class="small">${p==='kommande'?'Start om':'Tid kvar'}</span><b style="font-size:14px" data-count="${p==='kommande'?x.start:x.end}">${p==='avslutad'?'00:00:00':remain(p==='kommande'?x.start:x.end)}</b></div></div>${p==='live'&&app!=='approved'?`<div class="notice">Du måste ansöka och bli godkänd innan du kan lägga demobud.</div><button class="btn" data-apply="${esc(x.id)}">Ansök om att buda (demo)</button>`:p==='live'?`<div class="field"><label>Ditt nästa demobud (minst ${money(minimum)})</label><input id="bidAmount" type="number" min="${minimum}" step="${x.step||1000}" value="${minimum}"></div><button class="btn" data-bid="${esc(x.id)}">Lägg demobud</button>`:p==='kommande'?`<p class="muted">Auktionen startar ${datefmt(x.start)}.</p><button class="btn" data-apply="${esc(x.id)}">${app==='approved'?'Du är godkänd':'Ansök i förväg (demo)'}</button>`:'<p>Auktionen är avslutad. Inget köp sker automatiskt.</p>'}<p class="small muted">Ingen betalning, deposition eller finansieringskontroll sker här.</p></div><div class="panel"><h3>Budhistorik</h3><div class="bidlist">${x.bids.length?[...x.bids].sort((a,b)=>b.at-a.at).map(b=>`<div class="bid"><span>${esc(b.name)}<br><span class="muted small">${datefmt(b.at)}</span></span><b>${money(b.amount)}</b></div>`).join(''):'<p>Inga bud ännu.</p>'}</div></div>`:`<div class="panel"><h2>${money(x.price)}</h2><p>Kontakta säljaren – demo</p><div class="field"><label>Ditt meddelande</label><textarea id="contactText" placeholder="Hej, jag är intresserad av företaget..."></textarea></div><button class="btn" data-contact="${esc(x.id)}">Visa demobekräftelse</button><p class="muted small">Meddelandet skickas inte till någon.</p></div>`}</div></div>`}
function sell(){let x=editId?get(editId):null;return `<h1>${x?'Redigera din demoannons':'Sälj ditt företag'}</h1><p class="sub">Skapa en annons eller schemalägg en liveauktion. Allt sparas endast i den här webbläsaren.</p><div class="two"><form class="panel" id="listingForm"><div class="field"><label>Företagets namn *</label><input name="title" required maxlength="90" value="${esc(x?.title||'')}"></div><div class="row"><div class="field" style="flex:1"><label>Kategori</label><select name="category">${['Restaurang','Café','Butik','E-handel','Bilverkstad','Tjänsteföretag','Annat'].map(c=>`<option ${x?.category===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field" style="flex:1"><label>Ort *</label><input name="city" required value="${esc(x?.city||'')}"></div></div><div class="field"><label>Utgångspris / begärt pris (kr) *</label><input name="price" type="number" min="1000" max="1000000000" required value="${x?.price||350000}"></div><div class="field"><label>Beskrivning *</label><textarea name="description" required>${esc(x?.description||'')}</textarea></div><div class="field"><label>Bildadress (https://) – valfritt</label><input name="image" type="url" placeholder="https://..." value="${esc(x?.image||'')}"></div><div class="field"><label>Annonspaket (demo – ingen betalning)</label><select name="plan" id="plan">${[['free','Gratis'],['gold','Gold'],['ultimate','Ultimate']].map(([v,t])=>`<option value="${v}" ${x?.plan===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Försäljningssätt</label><select name="mode" id="mode"><option value="normal" ${!x?.auction?'selected':''}>Vanlig annons</option><option value="auction" ${x?.auction?'selected':''}>Liveauktion (Gold/Ultimate-demo)</option></select></div><div id="auctionFields"><div class="field"><label>Startdatum och tid</label><input name="start" type="datetime-local" value="${x?.start?localDate(x.start):localDate(Date.now()+3600000)}"></div><div class="field"><label>Slutdatum och tid</label><input name="end" type="datetime-local" value="${x?.end?localDate(x.end):localDate(Date.now()+day)}"></div><div class="field"><label>Minsta budhöjning (kr)</label><input name="step" type="number" min="100" value="${x?.step||5000}"></div></div><button class="btn" type="submit">${x?'Spara ändringar':'Publicera demoannons'}</button></form><aside><div class="panel"><h2>Så säljer du själv</h2><p>1. Beskriv verksamheten och priset.</p><p>2. Välj vanligt upplägg eller auktion.</p><p>3. Ange start och sluttid.</p><p>4. Granska uppgifter och publicera.</p><button class="btn secondary" data-page="academy">Gratis säljarakademi</button></div><div class="notice">I en riktig tjänst krävs säker verifiering, företagsuppgifter och juridisk granskning. Denna demo kontrollerar inte ägande.</div></aside></div>`}
function localDate(t){let d=new Date(t),off=d.getTimezoneOffset()*60000;return new Date(t-off).toISOString().slice(0,16)}
const lessons=[['Förbered din försäljning','Samla bolagsuppgifter, avtal och en tydlig beskrivning av vad som ingår.'],['Förstå företagets värde','Jämför resultat, tillgångar, risker och framtida intjäning. Ett utgångspris är inte en garanti.'],['Skapa en trovärdig annons','Visa bilder, omsättning och kostnader korrekt. Skydda känslig information.'],['Så fungerar budgivning','Bestäm villkor, tidsram och minsta budhöjning. Ett högsta bud är inte automatiskt ett bindande köp.'],['Granska köparen','Verifiera identitet och finansiering på en nivå som passar affären. Dela inte känsliga dokument öppet.'],['Avsluta affären tryggt','Gå igenom avtal, skulder, tillstånd och överlåtelse med relevant professionell hjälp vid behov.']];
function academy(){return `<h1>Gratis säljarakademi</h1><p class="sub">Lär dig grunderna i att sälja en verksamhet utan traditionell mäklare.</p><div class="panel"><h3>Din kursprogress</h3><div class="progress"><div style="width:${100*state.lessons.length/lessons.length}%"></div></div><p>${state.lessons.length} av ${lessons.length} lektioner markerade som klara</p></div><div class="grid">${lessons.map(([title,desc],i)=>`<div class="panel"><span class="tag">Lektion ${i+1}</span><h3>${esc(title)}</h3><p>${esc(desc)}</p><button class="btn ${state.lessons.includes(i)?'secondary':''}" data-lesson="${i}">${state.lessons.includes(i)?'✓ Klar – ångra':'Markera som klar'}</button></div>`).join('')}</div><div class="notice info">Utbildningen är introducerande information, inte juridisk eller ekonomisk rådgivning.</div>`}
function plans(){return `<h1>Annonspaket</h1><p class="sub">Exempel på framtida paket. Ingen betalning kan göras i demon.</p><div class="grid">${[['Gratis','0 kr','Vanlig annons, grundläggande synlighet'],['Gold','Pris bestäms senare','Schemalagd liveauktion och budhistorik'],['Ultimate','Pris bestäms senare','Liveauktion, extra synlighet och framhävning']].map(([name,price,desc])=>`<div class="panel"><span class="tag ${name==='Ultimate'?'gold':''}">${name}</span><h2>${price}</h2><p>${desc}</p><button class="btn" data-page="sell">Skapa demoannons</button></div>`).join('')}</div><div class="ad"><b>För annonsörer</b><p>Här planeras reklamplatser för banker, finansbolag och andra samarbetspartner. Inga avtal eller köp kan göras i denna demo.</p></div>`}
function account(){let own=state.listings.filter(x=>x.owner==='me');return `<h1>Mitt konto</h1><p class="sub">En lokal demoprofil – inget riktigt konto eller inloggning.</p><div class="two"><div class="panel"><div class="row"><div class="avatar" id="avatar">${state.profile.image?`<img class="avatar" src="${esc(state.profile.image)}" alt="Profilbild">`:'👤'}</div><div><h3>${esc(state.profile.name)}</h3><span class="tag">Demokonto</span></div></div><div class="field"><label>Visningsnamn</label><input id="profileName" maxlength="50" value="${esc(state.profile.name)}"></div><div class="field"><label>Ändra profilbild (max 1 MB)</label><input type="file" id="avatarFile" accept="image/png,image/jpeg,image/webp"></div><div class="row"><button class="btn" id="saveProfile">Spara profil</button><button class="btn secondary" id="removeAvatar">Ta bort bild</button></div></div><div class="panel"><h2>Mitt konto – demo</h2><p>Godkända auktioner: ${Object.values(state.applications).filter(v=>v==='approved').length}</p><p>Sparade annonser: ${state.favorites.length}</p><p>Mina annonser: ${own.length}</p><label class="row"><input type="checkbox" id="npcToggle" ${state.npc?'checked':''}> Aktivera NPC-demobud</label><p class="small muted">NPC-buden körs bara när demosidan är öppen. De är inte riktiga köpare.</p></div></div><section class="section"><h2>Mina annonser</h2>${own.length?`<div class="grid">${own.map(x=>`<div>${listingCard(x)}<div class="row" style="margin-top:8px"><button class="btn secondary" data-edit="${esc(x.id)}">Redigera</button><button class="btn danger" data-delete="${esc(x.id)}">Ta bort</button></div></div>`).join('')}</div>`:'<div class="panel">Du har inte skapat någon demoannons ännu. <button class="btn" data-page="sell">Skapa annons</button></div>'}</section><section class="section"><h2>Sparade annonser</h2><div class="grid">${state.listings.filter(x=>state.favorites.includes(x.id)).map(listingCard).join('')||'<p>Inga sparade annonser ännu.</p>'}</div></section><div class="panel"><button class="btn outline" id="resetDemo">Återställ hela demon</button><p class="small muted">Raderar dina lokala demoändringar i denna webbläsare.</p></div>`}
function render(){document.querySelectorAll('[data-page]').forEach(b=>{if(b.closest('#nav'))b.classList.toggle('active',b.dataset.page===page)});document.getElementById('app').innerHTML=page==='home'?home():page==='explore'?explore():page==='live'?live():page==='detail'?detail(get(selected)||state.listings[0]):page==='sell'?sell():page==='academy'?academy():page==='plans'?plans():account();let mode=document.getElementById('mode');if(mode){const update=()=>{document.getElementById('auctionFields').classList.toggle('hidden',mode.value!=='auction')};mode.addEventListener('change',update);update()}let form=document.getElementById('listingForm');if(form)form.addEventListener('submit',submitListing);let s=document.getElementById('searchBtn');if(s)s.onclick=search;let input=document.getElementById('search');if(input)input.addEventListener('input',search);let avatar=document.getElementById('avatarFile');if(avatar)avatar.onchange=uploadAvatar;let name=document.getElementById('saveProfile');if(name)name.onclick=()=>{state.profile.name=document.getElementById('profileName').value.trim()||'Demoanvändare';save();render();alert('Demoprofil sparad lokalt.')};let rm=document.getElementById('removeAvatar');if(rm)rm.onclick=()=>{state.profile.image='';save();render()};let toggle=document.getElementById('npcToggle');if(toggle)toggle.onchange=e=>{state.npc=e.target.checked;save()};let reset=document.getElementById('resetDemo');if(reset)reset.onclick=()=>{if(confirm('Återställa alla lokala demoändringar?')){localStorage.removeItem(STORE);state=load();go('home')}}}
function search(){let q=(document.getElementById('search')?.value||'').toLowerCase().trim();let out=state.listings.filter(x=>[x.title,x.category,x.city,x.description].join(' ').toLowerCase().includes(q));document.getElementById('results').innerHTML=out.map(listingCard).join('')||'<p>Inga annonser matchar sökningen.</p>'}
function submitListing(e){e.preventDefault();const f=new FormData(e.target),auction=f.get('mode')==='auction',plan=f.get('plan'),start=new Date(f.get('start')).getTime(),end=new Date(f.get('end')).getTime(),price=Number(f.get('price')),step=Number(f.get('step'));if(auction&&plan==='free'){alert('Välj Gold eller Ultimate för en demoauktion.');return}if(auction&&(!Number.isFinite(start)||!Number.isFinite(end)||end<=start||end<=Date.now()||step<100)){alert('Kontrollera starttid, sluttid och budhöjning. Sluttiden måste ligga i framtiden.');return}let prev=editId?get(editId):null;let item={id:prev?.id||'my_'+Date.now(),owner:'me',title:String(f.get('title')).trim(),category:f.get('category'),city:String(f.get('city')).trim(),price,description:String(f.get('description')).trim(),image:String(f.get('image')).trim(),plan,auction,start:auction?start:null,end:auction?end:null,step:auction?step:0,bids:prev?.bids||[]};if(prev&&prev.bids.length&& (prev.price!==price||prev.start!==start||prev.end!==end||prev.step!==step||!auction)){alert('Auktioner med registrerade demobud kan inte få sina grundvillkor ändrade.');return}if(prev)state.listings=state.listings.map(x=>x.id===prev.id?item:x);else state.listings.unshift(item);save();editId=null;selected=item.id;go('detail');alert('Demoannons sparad i denna webbläsare!')}
function uploadAvatar(e){const file=e.target.files?.[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>1024*1024){alert('Välj PNG, JPG eller WebP under 1 MB.');return}const r=new FileReader();r.onload=()=>{state.profile.image=String(r.result);save();render()};r.readAsDataURL(file)}
function apply(id){let x=get(id);if(!x||phase(x)==='avslutad')return;if(state.applications[id]==='approved'){alert('Du är redan godkänd i demon.');return}if(confirm('DEMO: Du ansöker som testbudgivare. I en riktig tjänst krävs identitetskontroll och eventuellt finansieringsbevis. Godkänna automatiskt i denna demo?')){state.applications[id]='approved';save();render();alert('Du är godkänd som DEMO-budgivare. Ingen verklig verifiering har skett.')}}
function bid(id){let x=get(id);if(!x||phase(x)!=='live'||state.applications[id]!=='approved')return;let v=Number(document.getElementById('bidAmount')?.value);if(!Number.isSafeInteger(v)||v<top(x)+(x.step||1000)){alert('Budet måste vara minst '+money(top(x)+(x.step||1000)));return}if(!confirm('Bekräfta ditt SIMULERADE bud på '+money(v)+'? Inga pengar dras.'))return;x.bids.push({name:state.profile.name+' (du · demo)',amount:v,at:Date.now()});save();render()}
function npcTick(){if(!state.npc||Math.random()>.35)return;let options=state.listings.filter(x=>x.auction&&phase(x)==='live'&&x.id.startsWith('a'));if(!options.length)return;let x=options[Math.floor(Math.random()*options.length)];let next=top(x)+(x.step||5000);x.bids.push({name:'NPC-demo '+(1+Math.floor(Math.random()*5)),amount:next,at:Date.now()});save();if(page==='live'||(page==='detail'&&selected===x.id)||page==='home')render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.page){editId=null;go(d.page)}else if(d.open){selected=d.open;go('detail')}else if(d.filter){filter=d.filter;render()}else if(d.fav){let i=state.favorites.indexOf(d.fav);i<0?state.favorites.push(d.fav):state.favorites.splice(i,1);save();render()}else if(d.apply)apply(d.apply);else if(d.bid)bid(d.bid);else if(d.contact)alert('Demo: meddelandet skickas inte.');else if(d.lesson!==undefined){let i=Number(d.lesson);state.lessons=state.lessons.includes(i)?state.lessons.filter(v=>v!==i):[...state.lessons,i];save();render()}else if(d.edit){editId=d.edit;go('sell')}else if(d.delete&&confirm('Ta bort din demoannons?')){state.listings=state.listings.filter(x=>x.id!==d.delete);save();render()}});
setInterval(()=>{document.querySelectorAll('[data-count]').forEach(el=>el.textContent=remain(Number(el.dataset.count)))},1000);setInterval(npcTick,12000);render();
</script>
</body></html>
